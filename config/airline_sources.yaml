# Each source starts from an airline listing page and follows only URLs that
# match url_pattern. Limits keep crawl cost predictable while still collecting
# multiple independent passenger reports per airline.
airlines:
  Qatar Airways:
    - source_name: Flight-Report
      url: https://flight-report.com/en/airline/4090/qatar-airways/
      url_pattern: '^https://flight-report\.com/en/report/'
      include_seed: false
      max_pages: 3
      min_content_characters: 2500
      required_terms: [Qatar Airways, Review of]
    - source_name: Tripadvisor
      url: https://www.tripadvisor.com/Airline_Review-d8729134-Reviews-Qatar-Airways
      url_pattern: '^https://www\.tripadvisor\.com/Airline_Review-d8729134-Reviews(?:-or\d+)?-Qatar-Airways(?:\.html)?$'
      include_seed: true
      pagination_step: 10
      max_pages: 3
      min_content_characters: 2500
      required_terms: [Qatar Airways, Date of travel]

