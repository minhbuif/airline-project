services:
  postgres:
    image: postgres:16
    container_name: airline_postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: airline_rag
      POSTGRES_USER: airline_user
      POSTGRES_PASSWORD: airline_pass
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./docker/init.sql:/docker-entrypoint-initdb.d/init.sql

  qdrant:
    image: qdrant/qdrant:latest
    container_name: airline_qdrant
    restart: unless-stopped
    ports:
      - "6333:6333"
      - "6334:6334"
    volumes:
      - qdrant_data:/qdrant/storage

  neo4j:
    image: neo4j:5.26-community
    container_name: airline_neo4j
    restart: unless-stopped
    environment:
      NEO4J_AUTH: neo4j/airline_graph_pass
    ports:
      - "7474:7474"
      - "7687:7687"
    volumes:
      - neo4j_data:/data

  ingest:
    build: .
    container_name: airline_ingest
    depends_on:
      - postgres
      - qdrant
      - neo4j
    env_file:
      - .env.docker
    volumes:
      - ./landing:/app/landing
      - ./logs:/app/logs
    command: ["python", "-m", "app.ingest"]

volumes:
  postgres_data:
  qdrant_data:
  neo4j_data:
